name: temporary-expo-deps-57-repair
on:
  push:
    branches: [fix/expo-deps-57]
permissions:
  contents: write
concurrency:
  group: expo-deps-57-repair
  cancel-in-progress: false
jobs:
  repair-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/expo-deps-57
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install baseline dependencies
        run: npm ci --no-audit --no-fund
      - name: Align the eight Expo SDK 57 dependencies
        run: npx expo install --fix
      - name: Pin compatible optional peer packages in the lockfile
        shell: bash
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --save-exact react-native-reanimated@4.5.5 react-native-worklets@0.10.4
          node <<'NODE'
          const fs = require('node:fs');
          const cp = require('node:child_process');
          const baseSha = 'a65872e5d8d107e98025c15a6b48aa85d183c6b0';
          const allowed = [
            'expo', 'expo-constants', 'expo-crypto', 'expo-image-picker',
            'expo-linking', 'expo-location', 'expo-notifications', 'expo-router'
          ];
          const base = JSON.parse(cp.execFileSync('git', ['show', `${baseSha}:package.json`], {encoding:'utf8'}));
          const current = JSON.parse(fs.readFileSync('package.json','utf8'));
          for (const name of allowed) {
            if (!current.dependencies?.[name]) throw new Error(`Missing Expo dependency after expo install --fix: ${name}`);
            base.dependencies[name] = current.dependencies[name];
          }
          fs.writeFileSync('package.json', JSON.stringify(base, null, 2) + '\n');
          NODE
      - name: Reinstall exactly from the regenerated lockfile
        id: clean-install
        run: npm ci --no-audit --no-fund
      - name: Prepare CI environment
        run: cp .env.example .env
      - name: Run requested verification commands
        id: validations
        shell: bash
        run: |
          set +e
          mkdir -p verification
          failed=0
          run_check() {
            label="$1"; shift
            log="verification/$label.log"
            echo "===== $label: $* ====="
            "$@" > "$log" 2>&1
            code=$?
            cat "$log"
            echo "EXIT_CODE=$code COMMAND=$*" | tee -a "$log"
            echo "- $label: exit $code" >> "$GITHUB_STEP_SUMMARY"
            if [ "$code" -ne 0 ]; then failed=1; fi
          }
          run_check doctor npm run doctor
          run_check lint npm run lint
          run_check typecheck npm run typecheck
          run_check test npm run test
          run_check export-web npm run export:web
          run_check playwright-install npx playwright install --with-deps chromium
          if [ "$failed" -eq 0 ]; then
            run_check e2e npm run e2e
          else
            echo "E2E not run because an earlier required check failed." | tee verification/e2e.log
            echo "- e2e: skipped because a previous check failed" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "FAILED=$failed" >> "$GITHUB_OUTPUT"
          exit "$failed"
      - name: Verify strict change scope and app.json preservation
        if: always()
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const cp = require('node:child_process');
          const baseSha = 'a65872e5d8d107e98025c15a6b48aa85d183c6b0';
          const expo = [
            'expo', 'expo-constants', 'expo-crypto', 'expo-image-picker',
            'expo-linking', 'expo-location', 'expo-notifications', 'expo-router'
          ];
          const peerPins = ['react-native-reanimated', 'react-native-worklets'];
          const allowed = [...expo, ...peerPins];
          const canon = v => Array.isArray(v) ? v.map(canon) :
            v && typeof v === 'object' ? Object.fromEntries(Object.keys(v).sort().map(k => [k, canon(v[k])])) : v;
          const readBase = p => JSON.parse(cp.execFileSync('git', ['show', `${baseSha}:${p}`], {encoding:'utf8'}));
          const basePkg = readBase('package.json');
          const nowPkg = JSON.parse(fs.readFileSync('package.json','utf8'));
          const baseDirect = basePkg.dependencies || {};
          const nowDirect = nowPkg.dependencies || {};
          const changedDirect = [...new Set([...Object.keys(baseDirect), ...Object.keys(nowDirect)])]
            .filter(k => JSON.stringify(baseDirect[k]) !== JSON.stringify(nowDirect[k]));
          console.log('Changed package.json dependencies:', changedDirect);
          if (JSON.stringify([...changedDirect].sort()) !== JSON.stringify([...expo].sort())) {
            throw new Error('package.json dependency changes are not exactly the eight approved Expo packages.');
          }
          if (JSON.stringify(canon({...basePkg, dependencies: nowDirect})) !== JSON.stringify(canon(nowPkg))) {
            throw new Error('package.json contains edits outside the eight approved dependency versions.');
          }
          const baseLock = readBase('package-lock.json');
          const nowLock = JSON.parse(fs.readFileSync('package-lock.json','utf8'));
          const rootBase = baseLock.packages?.['']?.dependencies || {};
          const rootNow = nowLock.packages?.['']?.dependencies || {};
          const changedRoot = [...new Set([...Object.keys(rootBase), ...Object.keys(rootNow)])]
            .filter(k => JSON.stringify(rootBase[k]) !== JSON.stringify(rootNow[k]));
          console.log('Changed package-lock root dependency records:', changedRoot);
          if (changedRoot.some(k => !allowed.includes(k))) {
            throw new Error('package-lock root dependency records changed outside the approved 10 packages.');
          }
          const allPaths = new Set([...Object.keys(baseLock.packages||{}), ...Object.keys(nowLock.packages||{})]);
          const changedPaths = [...allPaths].filter(k =>
            JSON.stringify(canon(baseLock.packages?.[k])) !== JSON.stringify(canon(nowLock.packages?.[k]))
          );
          const unexpected = changedPaths.filter(k => {
            if (k === '') return false;
            const p = k.split('node_modules/').pop();
            const name = p.startsWith('@') ? p.split('/').slice(0,2).join('/') : p.split('/')[0];
            return !allowed.includes(name);
          });
          console.log('Changed package-lock package records:', changedPaths);
          if (unexpected.length) {
            throw new Error('Unexpected package-lock package records changed: ' + unexpected.join(', '));
          }
          const beforeApp = cp.execFileSync('git', ['show', `${baseSha}:app.json`], {encoding:'utf8'});
          const afterApp = fs.readFileSync('app.json','utf8');
          if (beforeApp !== afterApp) throw new Error('app.json changed.');
          console.log('PASS: app.json is byte-for-byte unchanged.');
          for (const name of allowed) {
            const entry = nowLock.packages?.[`node_modules/${name}`];
            console.log(`${name}: ${entry?.version ?? '(not top-level)'}`);
          }
          NODE
      - name: Upload complete verification output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: expo-deps-57-verification
          path: |
            verification/
            package.json
            package-lock.json
          if-no-files-found: warn
          retention-days: 7
      - name: Commit only package.json and package-lock.json and remove temporary workflow
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git rm .github/workflows/expo-deps-57-repair.yml
          git commit -m "fix: align Expo SDK 57 dependencies"
          git push origin HEAD:fix/expo-deps-57
