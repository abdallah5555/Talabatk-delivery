name: oneoff-fix-drawer-typecheck

on:
  push:
    paths:
      - '.github/workflows/oneoff-fix-drawer-typecheck.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Fix drawer backdrop style typing
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/account.tsx')
          s=p.read_text()
          old='...StyleSheet.absoluteFillObject'
          new='...StyleSheet.absoluteFill'
          if old not in s:
              raise SystemExit('target not found')
          p.write_text(s.replace(old,new,1))
          PY
      - run: npm run lint
      - run: npm run typecheck
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/account.tsx
          git commit -m "fix: use typed absolute fill style in account drawer"
          git push origin HEAD:main
