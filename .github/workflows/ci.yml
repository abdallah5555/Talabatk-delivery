name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: write
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Upload generated dependency lockfile
        uses: actions/upload-artifact@v4
        with:
          name: npm-package-lock
          path: package-lock.json
          if-no-files-found: error
      - name: Commit dependency lockfile when changed
        if: github.event_name == 'push'
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json && git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            echo "package-lock.json is already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "build: lock npm dependencies"
          git push
      - run: cp .env.example .env
      - run: npm run doctor
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run export:web
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
