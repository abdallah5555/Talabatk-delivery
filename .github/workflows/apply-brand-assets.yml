name: apply-brand-assets

on:
  push:
    branches: [main]
    paths:
      - 'assets/brand-icon.svg'
      - 'assets/brand-adaptive.svg'
      - 'assets/brand-logo.svg'
      - '.github/workflows/apply-brand-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-brand-assets
  cancel-in-progress: true

jobs:
  rasterize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Install SVG renderer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends librsvg2-bin
      - name: Generate Android, splash and PWA PNG assets
        run: |
          rsvg-convert -w 1024 -h 1024 assets/brand-icon.svg -o assets/app-icon.png
          rsvg-convert -w 1024 -h 1024 assets/brand-adaptive.svg -o assets/adaptive-icon.png
          rsvg-convert -w 1024 -h 1024 assets/brand-logo.svg -o assets/brand-logo.png
          mkdir -p public/icons
          rsvg-convert -w 192 -h 192 assets/brand-icon.svg -o public/icons/icon-192.png
          rsvg-convert -w 512 -h 512 assets/brand-icon.svg -o public/icons/icon-512.png
          file assets/app-icon.png assets/adaptive-icon.png assets/brand-logo.png public/icons/icon-192.png public/icons/icon-512.png
      - name: Commit generated branding assets
        run: |
          if git diff --quiet -- assets/app-icon.png assets/adaptive-icon.png assets/brand-logo.png public/icons/icon-192.png public/icons/icon-512.png; then
            echo 'Brand assets already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/app-icon.png assets/adaptive-icon.png assets/brand-logo.png public/icons/icon-192.png public/icons/icon-512.png
          git commit -m 'brand: regenerate approved logo assets'
          git pull --rebase origin main
          git push origin HEAD:main
