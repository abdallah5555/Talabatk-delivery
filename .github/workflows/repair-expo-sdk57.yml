name: expo-sdk57-peer-lock-repair
on:
  push:
    branches: [fix/expo-deps-57]
permissions:
  contents: write
concurrency:
  group: expo-sdk57-peer-lock-repair
  cancel-in-progress: false
jobs:
  repair-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/expo-deps-57
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install baseline dependencies
        run: npm ci --no-audit --no-fund
      - name: Align Expo SDK 57 dependencies
        run: npx expo install --fix
      - name: Add compatible optional peer records to package lock only
        shell: bash
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --save-exact react-native-reanimated@4.5.5 react-native-worklets@0.10.4
          node <<'NODE'
          const fs = require('node:fs');
          const cp = require('node:child_process');
          const baseSha = 'a65872e5d8d107e98025c15a6b48aa85d183c6b0';
          const allowed = [
            'expo', 'expo-constants', 'expo-crypto', 'expo-image-picker',
            'expo-linking', 'expo-location', 'expo-notifications', 'expo-router'
          ];
          const base = JSON.parse(cp.execFileSync('git', ['show', `${baseSha}:package.json`], {encoding:'utf8'}));
          const current = JSON.parse(fs.readFileSync('package.json','utf8'));
          for (const name of allowed) {
            if (!current.dependencies?.[name]) throw new Error(`Missing dependency after expo install --fix: ${name}`);
            base.dependencies[name] = current.dependencies[name];
          }
          fs.writeFileSync('package.json', JSON.stringify(base, null, 2) + '\n');
          NODE
      - name: Verify npm ci against the lockfile
        run: npm ci --no-audit --no-fund
      - name: Prepare CI environment
        run: cp .env.example .env
      - name: Run required checks and preserve complete logs
        id: checks
        shell: bash
        run: |
          set +e
          mkdir -p verification
          failed=0
          run_check() {
            label="$1"; shift
            log="verification/$label.log"
            echo "===== $label: $* ====="
            "$@" > "$log" 2>&1
            code=$?
            cat "$log"
            printf '\nEXIT_CODE=%s COMMAND=%s\n' "$code" "$*" >> "$log"
            echo "- $label: exit $code" >> "$GITHUB_STEP_SUMMARY"
            if [ "$code" -ne 0 ]; then failed=1; fi
          }
          run_check doctor npm run doctor
          run_check lint npm run lint
          run_check typecheck npm run typecheck
          run_check test npm run test
          run_check export-web npm run export:web
          run_check playwright-install npx playwright install --with-deps chromium
          if [ "$failed" -eq 0 ]; then
            run_check e2e npm run e2e
          else
            echo "E2E skipped because an earlier required check failed." | tee verification/e2e.log
            echo "- e2e: skipped because an earlier check failed" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "FAILED=$failed" >> "$GITHUB_OUTPUT"
          exit "$failed"
      - name: Verify manifest scope, lockfile package scope and app.json
        if: always()
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const cp = require('node:child_process');
          const baseSha = 'a65872e5d8d107e98025c15a6b48aa85d183c6b0';
          const expo = [
            'expo', 'expo-constants', 'expo-crypto', 'expo-image-picker',
            'expo-linking', 'expo-location', 'expo-notifications', 'expo-router'
          ];
          const peer = ['react-native-reanimated', 'react-native-worklets'];
          const allowed = [...expo, ...peer];
          const canon = v => Array.isArray(v) ? v.map(canon) :
            v && typeof v === 'object' ? Object.fromEntries(Object.keys(v).sort().map(k => [k, canon(v[k])])) : v;
          const readJson = p => JSON.parse(cp.execFileSync('git', ['show', `${baseSha}:${p}`], {encoding:'utf8'}));
          const basePkg = readJson('package.json');
          const nowPkg = JSON.parse(fs.readFileSync('package.json','utf8'));
          const baseDirect = basePkg.dependencies || {};
          const nowDirect = nowPkg.dependencies || {};
          const changedDirect = [...new Set([...Object.keys(baseDirect), ...Object.keys(nowDirect)])]
            .filter(k => JSON.stringify(baseDirect[k]) !== JSON.stringify(nowDirect[k]));
          console.log('Changed package.json direct dependencies:', changedDirect);
          if (changedDirect.some(name => !expo.includes(name))) {
            throw new Error('package.json contains a changed direct dependency outside the eight approved Expo packages.');
          }
          const expectedPkg = structuredClone(basePkg);
          for (const name of expo) expectedPkg.dependencies[name] = nowDirect[name];
          if (JSON.stringify(canon(expectedPkg)) !== JSON.stringify(canon(nowPkg))) {
            throw new Error('package.json has changes outside the eight approved Expo dependency values.');
          }
          const baseLock = readJson('package-lock.json');
          const nowLock = JSON.parse(fs.readFileSync('package-lock.json','utf8'));
          const rootBase = baseLock.packages?.['']?.dependencies || {};
          const rootNow = nowLock.packages?.['']?.dependencies || {};
          const changedRoot = [...new Set([...Object.keys(rootBase), ...Object.keys(rootNow)])]
            .filter(k => JSON.stringify(rootBase[k]) !== JSON.stringify(rootNow[k]));
          console.log('Changed package-lock root dependencies:', changedRoot);
          if (changedRoot.some(k => !allowed.includes(k))) {
            throw new Error('package-lock root records contain changes outside the eight Expo packages and two approved peer pins.');
          }
          const packageKeys = lock => lock.packages || {};
          function resolveDependency(fromPath, depName, packages) {
            let dir = fromPath;
            while (true) {
              const candidate = (dir ? dir + '/' : '') + 'node_modules/' + depName;
              if (packages[candidate]) return candidate;
              const marker = dir.lastIndexOf('/node_modules/');
              if (marker >= 0) {
                dir = dir.slice(0, marker);
              } else if (dir.startsWith('node_modules/')) {
                dir = '';
              } else {
                return null;
              }
              if (!dir) {
                const rootCandidate = 'node_modules/' + depName;
                return packages[rootCandidate] ? rootCandidate : null;
              }
            }
          }
          function dependencyClosure(lock) {
            const packages = packageKeys(lock);
            const visited = new Set();
            const queue = allowed.map(name => 'node_modules/' + name).filter(p => packages[p]);
            while (queue.length) {
              const current = queue.shift();
              if (visited.has(current)) continue;
              visited.add(current);
              const entry = packages[current] || {};
              const names = new Set([
                ...Object.keys(entry.dependencies || {}),
                ...Object.keys(entry.optionalDependencies || {}),
                ...Object.keys(entry.peerDependencies || {})
              ]);
              for (const name of names) {
                const resolved = resolveDependency(current, name, packages);
                if (resolved && !visited.has(resolved)) queue.push(resolved);
              }
            }
            return visited;
          }
          const baseClosure = dependencyClosure(baseLock);
          const currentClosure = dependencyClosure(nowLock);
          const allowedLockPaths = new Set([...baseClosure, ...currentClosure]);
          const allPaths = new Set([...Object.keys(packageKeys(baseLock)), ...Object.keys(packageKeys(nowLock))]);
          const changedPaths = [...allPaths].filter(k =>
            JSON.stringify(canon(packageKeys(baseLock)[k])) !== JSON.stringify(canon(packageKeys(nowLock)[k]))
          );
          const unexpected = changedPaths.filter(k => k !== '' && !allowedLockPaths.has(k));
          console.log('Changed package-lock package records:', changedPaths);
          if (unexpected.length) {
            throw new Error('package-lock changes include packages outside approved Expo/peer dependency trees: ' + unexpected.join(', '));
          }
          for (const [name, version] of Object.entries({
            'react-native-reanimated':'4.5.5',
            'react-native-worklets':'0.10.4'
          })) {
            const actual = nowLock.packages?.['node_modules/' + name]?.version;
            if (actual !== version) throw new Error(name + ' lock version must be ' + version + ', found ' + actual);
          }
          const appBase = cp.execFileSync('git', ['show', `${baseSha}:app.json`], {encoding:'utf8'});
          const appNow = fs.readFileSync('app.json','utf8');
          if (appBase !== appNow) throw new Error('app.json changed.');
          console.log('PASS: app.json is byte-for-byte unchanged.');
          for (const name of allowed) console.log(`${name}: ${nowLock.packages?.[`node_modules/${name}`]?.version || '(no top-level lock entry)'}`);
          NODE
      - name: Upload verification logs and generated lockfiles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: expo-sdk57-peer-lock-verification
          path: |
            verification/
            package.json
            package-lock.json
          if-no-files-found: warn
          retention-days: 7
      - name: Commit verified dependency files and remove temporary workflows
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git rm .github/workflows/repair-expo-sdk57.yml
          git rm .github/workflows/expo-deps-57-repair.yml
          git commit -m "fix: align Expo SDK 57 dependencies"
          git push origin HEAD:fix/expo-deps-57
